name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@v7

      # Step 2: run the sync action
      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: tangly1024/NotionNext
          upstream_sync_branch: main
          target_sync_branch: main
          # 默认的 GITHUB_TOKEN 无法推送 .github/workflows 下的文件变更。
          # 若上游修改了 workflow 文件，需在仓库 Settings → Secrets 中配置
          # SYNC_PAT（PAT，需勾选 repo 与 workflow 权限）才能自动同步。
          target_repo_token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

          # Set test_mode true to run tests instead of the true action!!
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 同步失败，常见原因："
          echo "1. 上游修改了 .github/workflows 下的文件，而默认 GITHUB_TOKEN 没有 workflow 权限，推送被拒绝（remote rejected ... without workflows permission）。"
          echo "   解决：在仓库 Settings → Secrets and variables → Actions 中添加名为 SYNC_PAT 的 Personal Access Token（classic，勾选 repo 与 workflow），或手动在仓库首页点击一次 Sync fork。"
          echo "2. 仓库长期无提交活动，GitHub 自动暂停了定时任务，需要手动 Sync fork 一次并重新启用 workflow。"
          exit 1
